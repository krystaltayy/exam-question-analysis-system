<!DOCTYPE html>
<html>
<head>
    <title>Bloom Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Rule-Based Web Examination Question Analysis System Using Bloom’s Taxonomy</h1>
<p class="subtitle">Enter your question to analyze</p>

<div class="container">

    <form action="/analyze" method="POST">

        <textarea
            name="question"
            placeholder="What do you want to analyze?"
        ></textarea>

        <select name="type">
            <option value="MCQ">MCQ</option>
            <option value="Essay">Essay</option>
            <option value="Structured">Structured</option>
        </select>

        <button type="submit">Analyze Question</button>

    </form>

</div>

</body>
</html>
