<!DOCTYPE html>
<html>
<head>

    <title>Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="dashboard">

    <h1>Dashboard</h1>

    <div class="result-box">

        <div class="result-left">
            <p><strong>📄 Filename:</strong> {{ question }}</p>
            <p><strong>🟠 C1 - Remember:</strong> {{ c1_percent | default('60') }}%</p>
            <p><strong>🔵 C2 - Understand:</strong> {{ c2_percent | default('40') }}%</p>
        </div>

        <div class="result-right">
            <p><strong>🎯 Bloom Level:</strong> {{ level }}</p>
            <p><strong>🕐 Date Analyzed:</strong> <span id="datetime"></span></p>
        </div>

    </div>

    <div class="charts-container">

        <div class="chart-box">
            <h3>Cognitive 1 - Remember</h3>
            <canvas id="chart1"></canvas>
        </div>

        <div class="chart-box">
            <h3>Cognitive 2 - Understand</h3>
            <canvas id="chart2"></canvas>
        </div>

        <div class="chart-box">
            <h3>Overall Classification</h3>
            <canvas id="chart3"></canvas>
        </div>

    </div>

</div>

<script>

// DATE & TIME
const now = new Date();
const options = { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' };
document.getElementById('datetime').textContent = now.toLocaleString('en-GB', options);

const c1 = {{ c1_percent | default(60) }};
const c2 = {{ c2_percent | default(40) }};

const ctx1 = document.getElementById('chart1');

new Chart(ctx1, {
    type: 'pie',
    data: {
        labels: ['Define', 'List', 'State'],
        datasets: [{
            data: [10, 20, 30],
            backgroundColor: ['#ff9f43', '#feca57', '#ff6b6b']
        }]
    }
});

const ctx2 = document.getElementById('chart2');

new Chart(ctx2, {
    type: 'pie',
    data: {
        labels: ['Explain', 'Summarize', 'Describe'],
        datasets: [{
            data: [15, 25, 35],
            backgroundColor: ['#48dbfb', '#0abde3', '#1dd1a1']
        }]
    }
});

const ctx3 = document.getElementById('chart3');

new Chart(ctx3, {
    type: 'pie',
    data: {
        labels: ['C1', 'C2'],
        datasets: [{
            data: [c1, c2],
            backgroundColor: ['#ff9f43', '#48dbfb']
        }]
    }
});

</script>

</body>
</html>
