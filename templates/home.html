<!DOCTYPE html>
<html>

<head>
    <title>Bloom Analyzer</title>
</head>

<body>
<h1 style="color:blue">THIS IS HOME</h1>
    <h1>Rule-Based Web Examination Question Analysis System</h1>

    <form action="/analyze" method="POST">

        <input
            type="text"
            name="question"
            placeholder="Enter your question"
            required
        >

        <button type="submit">
            Analyze
        </button>

    </form>

    {% if error %}

    <p style="color:red;">
       {{ error }}
    </p>

    {% endif %}

    <hr>

    {% if result %}

        <h2>Analysis Result</h2>

        <p>
            <strong>Question:</strong>
            {{ question }}
        </p>

        <p>
            <strong>Bloom Level:</strong>
            {{ result }}
        </p>

    {% endif %}

</body>

</html>
