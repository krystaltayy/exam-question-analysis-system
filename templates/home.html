<!DOCTYPE html>
<html>

<head>
    <title>Bloom Analyzer</title>
</head>

<body>

    <h1>Rule-Based Web Examination Question Analysis System</h1>

    <form action="/analyze" method="POST">

        <input
            type="text"
            name="question"
            placeholder="Enter your question"
            required
        >

        <br><br>

        <select name="type">

            <option value="MCQ">MCQ</option>
            <option value="Structured">Structured</option>
            <option value="Essay">Essay</option>

        </select>

        <br><br>

        <button type="submit">
            Analyze
        </button>

    </form>

    <hr>

    {% if result %}

        <h2>Analysis Result</h2>

        <p>
            <strong>Question:</strong>
            {{ question }}
        </p>

        <p>
            <strong>Bloom Level:</strong>
            {{ result }}
        </p>

    {% endif %}

</body>

</html>
