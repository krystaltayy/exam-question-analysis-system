<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
</head>
<body>

<div class="wrapper">
    <div class="card">

        <div class="form-panel">
            <a href="/login" class="back-btn">← Back</a>

            <h1>Reset Password</h1>
            <p class="subtitle">Enter your email and new password</p>

            {% if error %}
            <p style="color:red;">{{ error }}</p>
            {% endif %}

            {% if success %}
            <p style="color:green;">{{ success }}</p>
            {% endif %}

            <form action="/forgot_password" method="POST">

                <div class="input-group">
                    <input type="email" name="email" placeholder="Email" required>

                    <div class="input-wrap">
                        <input type="password" name="new_password" id="newPw" placeholder="New Password" required>
                        <span class="eye-icon" onclick="togglePw('newPw')">👁</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Reset Password
                </button>

            </form>
        </div>

    </div>
</div>

<script>
function togglePw(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
}
</script>

</body>
</html>
