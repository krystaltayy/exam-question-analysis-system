<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='forgotpassword.css') }}">
</head>
<body>

<div class="wrapper">
    <div class="card">

        <div class="form-panel">
            <a href="/login" class="back-btn">← Back</a>

            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new password</p>

            {% if error %}
            <p class="alert alert-error">{{ error }}</p>
            {% endif %}

            {% if success %}
            <p class="alert alert-success">{{ success }}</p>
            {% endif %}

            {% if not invalid and not success %}
            <form action="{{ url_for('reset_password', token=token) }}" method="POST">

                <div class="input-group">
                    <div class="input-wrap">
                        <input type="password" name="new_password" id="newPw" placeholder="New Password" required>
                        <span class="eye-icon" onclick="togglePw('newPw')">👁</span>
                    </div>

                    <div class="input-wrap">
                        <input type="password" name="confirm_password" id="confirmPw" placeholder="Confirm New Password" required>
                        <span class="eye-icon" onclick="togglePw('confirmPw')">👁</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Reset Password
                </button>

            </form>
            {% endif %}

            {% if success %}
            <a href="/login" class="btn-primary" style="display:inline-block; text-align:center; text-decoration:none;">Go to Login</a>
            {% endif %}

        </div>

    </div>
</div>

<script>
function togglePw(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
}
</script>

</body>
</html>
