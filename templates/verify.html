<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='verify.css') }}">
</head>
<body>
    <div class="card" id="verifyCard">
        <h2>Verify Your Account</h2>
        <p class="subtitle">We sent a 6-digit code to your email. Enter it below.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/verify">
            <input type="text" name="code" maxlength="6" placeholder="000000" required autofocus>
            <button type="submit">Verify</button>
        </form>

        <div class="back">
            Wrong email? <a href="/signup">Go back</a>
        </div>
    </div>

    <!-- Success popup -->
    {% if success %}
    <div class="popup-overlay" id="popup">
        <div class="popup-box">
            <div class="popup-emoji">🎉</div>
            <h3>You're all set!!</h3>
            <p>Redirecting you to login...</p>
        </div>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = "/login";
        }, 2500);
    </script>
    {% endif %}
</body>
</html>
